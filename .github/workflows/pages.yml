name: Deploy to GitHub Pages
# Deploys only when every gate passes: lint, types, unit tests, build, zero-egress, npm audit,
# e2e (Playwright + axe + runtime network-negative check), README Mermaid diagrams and CodeQL. Dependency review runs on PRs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (includes tsc -b)
        run: npm run build
      - name: Zero-egress check (no network APIs in the bundle)
        run: |
          ! grep -E "XMLHttpRequest|sendBeacon|fetch\(" dist/assets/*.js
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Install Chromium for e2e
        run: npx playwright install --with-deps chromium
      - name: e2e (Playwright + axe, zero external requests)
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8 -t 60000 http://localhost:4173/mcp-shield/
          SHOTS=0 node scripts/e2e.mjs | tee e2e.log
          grep -q "^external \[\] errors \[\] axe \[\]$" e2e.log
          SHOTS=0 node scripts/e2e-mobile.mjs | tee e2e-mobile.log
          grep -q "^external \[\] errors 0 \[\] axe \[\]$" e2e-mobile.log
      - name: README diagrams (Mermaid renders in Chromium)
        run: npm run readme-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push'
        with:
          name: dist
          path: dist
          retention-days: 1

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: javascript-typescript, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
