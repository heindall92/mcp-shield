name: Deploy to GitHub Pages
# Deploys only when every gate passes: lint, types, unit tests, build, zero-egress, npm audit,
# e2e (Playwright + axe + runtime network-negative check), README Mermaid diagrams and CodeQL. Dependency review runs on PRs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (includes tsc -b)
        run: npm run build
      - name: Zero-egress check (no network APIs in the bundle)
        run: |
          ! grep -E "XMLHttpRequest|sendBeacon|fetch\(" dist/assets/*.js
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Install Chromium for e2e
        run: npx playwright install --with-deps chromium
      - name: e2e (Playwright + axe, zero external requests)
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8 -t 60000 http://localhost:4173/mcp-shield/
          SHOTS=0 node scripts/e2e.mjs | tee e2e.log
          grep -q "^external \[\] errors \[\] axe \[\]$" e2e.log
          SHOTS=0 node scripts/e2e-mobile.mjs | tee e2e-mobile.log
          grep -q "^external \[\] errors 0 \[\] axe \[\]$" e2e-mobile.log
      - name: README diagrams (Mermaid renders in Chromium)
        run: npm run readme-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: dist
          path: dist
          retention-days: 1

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
